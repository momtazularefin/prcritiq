[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "prcritiq"
version = "0.1.0"
description = "Evidence-backed pull request review agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
  { name = "Momtazul Arefin" },
]
keywords = ["ai", "code-review", "github-app", "langgraph", "pull-requests"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "anthropic>=0.40.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "langgraph>=0.2.0",
  "openai>=3.3.1,<4",
  "psycopg[binary]>=3.2.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.8.0",
  "pyjwt[crypto]>=2.8.0",
  "uvicorn[standard]>=0.30.0",
]

[project.scripts]
prcritiq = "prcritiq.cli:main"

[dependency-groups]
# Executables the review runs as allowlisted static analysis. The container
# image installs this group, so the deployed ruff is the locked one.
tools = [
  "ruff>=0.6.0",
]
dev = [
  { include-group = "tools" },
  "httpx2>=2.5.0",
  "pytest>=8.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prcritiq"]
artifacts = ["src/prcritiq/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
# conftest holds the shared GitHub stub, imported directly by test modules.
known-local-folder = ["conftest"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
