# Local Postgres for development and integration tests.
#
#   docker compose up -d
#   export DATABASE_URL=postgresql://prcritiq:prcritiq@localhost:5433/prcritiq
#   uv run pytest
#
# Port 5433 rather than 5432 so this never collides with a Postgres already
# running on the host.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: prcritiq
      POSTGRES_PASSWORD: prcritiq
      POSTGRES_DB: prcritiq
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prcritiq -d prcritiq"]
      interval: 3s
      timeout: 3s
      retries: 20
